[versions]
agp = "8.13.2"
kotlin = "2.4.21"
ksp = "2.3.14"
composeBom = "2025.12.01"
room = "2.8.4"
lifecycle = "2.10.0"
activityCompose = "1.12.4"
navigationCompose = "2.9.6"
